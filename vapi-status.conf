# /etc/nginx/conf.d/warmbly.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# http -> https
server {

    if ($host = status.vapi.happytailspawcare.com.happytailspawcare.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name status.vapi.happytailspawcare.com.happytailspawcare.com;
    return 301 https://$host$request_uri;

}

# web UI
server {
    listen 443 ssl http2;
    server_name status.vapi.happytailspawcare.com.happytailspawcare.com;
    ssl_certificate /etc/letsencrypt/live/crm.happytailspawcare.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/crm.happytailspawcare.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    location / {
        proxy_pass http://127.0.0.1:2326;
        include snippets/warmbly-proxy.conf;
	#websocket
        proxy_read_timeout 3600s;
    }


}
